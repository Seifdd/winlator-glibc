name: Build APK

on:
  workflow_dispatch:
    inputs:
      replace_imagefs:
        description: "Replace assets/imagefs.tzst with a custom rootfs (URL + SHA-256 below)"
        type: boolean
        default: false
      rootfs_url:
        description: "Direct download URL of the .tzst (must be a PUBLISHED release)"
        type: string
        default: ""
      rootfs_sha256:
        description: "SHA-256 of that file"
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      -       - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Accept all SDK licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Show current assets (diagnostic)
        run: ls -la app/src/main/assets || true

      - name: Replace imagefs with custom rootfs
        if: ${{ inputs.replace_imagefs }}
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
          ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
        run: |
          set -euo pipefail
          test -n "$ROOTFS_URL" && test -n "$ROOTFS_SHA256"
          curl -fL --retry 3 -o /tmp/imagefs.tzst "$ROOTFS_URL"
          echo "$ROOTFS_SHA256  /tmp/imagefs.tzst" | sha256sum -c -
          mkdir -p app/src/main/assets
          cp /tmp/imagefs.tzst app/src/main/assets/imagefs.tzst
          ls -la app/src/main/assets

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
