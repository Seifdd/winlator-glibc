name: Build APK

on:
  workflow_dispatch:
    inputs:
      replace_imagefs:
        description: "Replace assets/imagefs.tzst with a custom rootfs"
        type: boolean
        default: false
      rootfs_url:
        description: "Direct URL of the .tzst (published release)"
        type: string
        default: ""
      rootfs_sha256:
        description: "SHA-256 of that file"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept all SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "Using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Show assets
        run: ls -la app/src/main/assets || true

      - name: Replace imagefs
        if: ${{ inputs.replace_imagefs }}
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
          ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/imagefs.tzst "$ROOTFS_URL"
          echo "$ROOTFS_SHA256  /tmp/imagefs.tzst" | sha256sum -c -
          mkdir -p app/src/main/assets
          cp /tmp/imagefs.tzst app/src/main/assets/imagefs.tzst

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          {
            echo '### Last 60 lines of build log'
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
