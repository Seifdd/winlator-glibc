name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      replace_imagefs:
        description: "Replace assets/imagefs.tzst with a custom rootfs"
        type: boolean
        default: false
      rootfs_url:
        description: "Direct URL of the .tzst (published release)"
        type: string
        default: ""
      rootfs_sha256:
        description: "SHA-256 of that file"
        type: string
        default: ""
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Exact NDK and CMake Required
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses || true
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Replace imagefs
        if: ${{ inputs.replace_imagefs }}
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
          ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/imagefs.tzst "$ROOTFS_URL"
          echo "$ROOTFS_SHA256  /tmp/imagefs.tzst" | sha256sum -c -
          mkdir -p app/src/main/assets
          cp /tmp/imagefs.tzst app/src/main/assets/imagefs.tzst

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
